<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soal 02 — Registrasi Peserta React</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .hero{padding:28px;border-radius:12px;background:#123b48;color:#fff;margin-bottom:24px}
    .hero .eyebrow{color:#b9dce2;font:12px "IBM Plex Mono",monospace;letter-spacing:.12em}
    .hero h1{margin:8px 0;color:#fff}.hero p{color:#d6e8eb;margin:0}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .panel{border:1px solid var(--border);border-radius:10px;padding:22px;min-width:0}
    .panel h2{margin-bottom:6px}.muted{color:var(--muted);font-size:14px}
    .users{list-style:none;padding:0;margin:14px 0}.users li{padding:12px 0;border-bottom:1px solid var(--rule)}
    .result{min-height:52px;white-space:pre-wrap;overflow-wrap:anywhere}
    .result[data-state=error]{color:var(--negative);background:#fff1f1}
    .result[data-state=success]{color:var(--positive)}
    .form-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .post-result{max-height:240px;overflow:auto}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.hero{padding:22px}}
  </style>
  <script src="../../vendor/react.development.js"></script>
  <script src="../../vendor/react-dom.development.js"></script>
  <script src="../../vendor/axios.min.js"></script>
  <script src="../../vendor/babel.min.js"></script>
</head>
<body>
  <main class="sheet" style="margin:24px auto;max-width:1120px;min-height:calc(100vh - 48px)">
    <p class="page-meta">MODUL 07 / AJAX DAN KONSUMSI API / SOAL 02</p>
    <div id="root"></div>
  </main>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
